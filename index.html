<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wolfitosis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Overlay -->
        <div id="ui-layer">
            <div id="flask-container">
                <div id="flask" class="flask">
                    <div class="flask-liquid"></div>
                </div>
                <p>Clic para generar Lobito</p>
            </div>
            
            <div id="stats">
                <p>Lobitos: <span id="lobito-count">0</span></p>
                <p>Madera: <span id="wood-count">0</span></p>
                <p>Camas: <span id="bed-count">0</span></p>
                <button id="bed-btn" disabled>🛏 Construir cama (3 maderas)</button>
            </div>
        </div>
        
        <!-- Ayuda de controles -->
        <div id="help-overlay">
            Clic en lobito: seleccionar · Ctrl/Shift+Clic: multiseleccion ·
            Clic en zona con seleccionados: mover · Sin seleccionados: deseleccionar ·
            Clic en arbol: talar (3 golpes = 3 maderas)
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
